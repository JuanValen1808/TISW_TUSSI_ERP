version: '3.8'
services:
  db_tussi:
    image: mysql:8.0
    container_name: tussi_erp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: erp_farmaceutico
      MYSQL_USER: erp_admin
      MYSQL_PASSWORD: admin_password
    ports:
      - "3307:3306"
    volumes:
      - ./DbScripts:/docker-entrypoint-initdb.d   # Ejecuta init.sql al crear el contenedor
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: administrador visual de la BD en el navegador (http://localhost:8080)
  adminer:
    image: adminer
    container_name: tussi_erp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db_tussi

volumes:
  mysqldata:
